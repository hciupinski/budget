name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore .NET
        run: dotnet restore budget.slnx

      - name: Build .NET
        run: dotnet build budget.slnx --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test budget.slnx --configuration Release --no-build

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Test web
        working-directory: web
        run: npm run test

      - name: Build web
        working-directory: web
        run: npm run build
